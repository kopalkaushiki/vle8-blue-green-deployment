apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bluegreen
      color: blue
  template:
    metadata:
      labels:
        app: bluegreen
        color: blue
    spec:
      containers:
      - name: myapp
        image: nginx
        ports:
        - containerPort: 80
